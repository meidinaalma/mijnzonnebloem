<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V203E5FRMQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V203E5FRMQ');
    </script>
    <title>🌻 Journey Through Grieving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="audio-overlay" id="audio-overlay" aria-label="Start audio" role="button">
      <div class="audio-overlay-content">
        <p class="audio-overlay-title">Tap to start</p>
        <p class="audio-overlay-subtitle">Play the memory soundtrack</p>
      </div>
    </div>
    <div class="audio-player" aria-label="Background music">
      <audio
        id="bg-audio"
        class="audio-player-control"
        loop
        controls
        autoplay
        muted
        playsinline
        preload="auto"
      >
        <source src="assets/lagu 1.mp3" type="audio/mpeg" />
      </audio>
    </div>
    <main>
      <section class="panel canva-embed" aria-labelledby="cover-title">
        <h1 id="cover-title" class="visually-hidden">Our beloved grandma</h1>
        <div class="canva-embed-frame">
          <iframe
            title="Canva design"
            loading="lazy"
            src="https://www.canva.com/design/DAHAISSPr3w/5JedpQljwOhF-VFTBLcP_g/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen"
          ></iframe>
          <a
            class="desktop-hotspot-heartbreak"
            href="page3web-view.html"
            aria-label="My Biggest Heartbreak"
            data-audio-save="true"
          ></a>
        </div>
      </section>
      <section class="mobile-portrait" aria-labelledby="mobile-title">
        <h1 id="mobile-title" class="visually-hidden">Our beloved grandma</h1>
        <div class="mobile-embed-frame">
          <iframe
            title="Canva mobile design"
            loading="lazy"
            src="https://www.canva.com/design/DAHAI4yhJ28/RmSjKlZbouXgaQ6EmwNLTg/view?embed"
          ></iframe>
          <div class="mobile-embed-ui-mask" aria-hidden="true"></div>
          <a
            class="mobile-hotspot-heartbreak"
            href="page3mobile-view.html"
            aria-label="My Biggest Heartbreak"
            data-audio-save="true"
          ></a>
        </div>
      </section>
    </main>
    <script>
      const audio = document.getElementById("bg-audio");
      let isRestoringAudio = true;
      const startAudio = () => {
        if (!audio) return;
        audio.play().catch(() => {});
      };

      const restoreAudioTime = () => {
        if (!audio) return;
        const savedTime = Number.parseFloat(sessionStorage.getItem("audioTime") || "0");
        if (!Number.isNaN(savedTime) && savedTime > 0) {
          audio.currentTime = savedTime;
        }
        isRestoringAudio = false;
      };

      const saveAudioTime = () => {
        if (!audio) return;
        if (isRestoringAudio) return;
        if (!Number.isNaN(audio.currentTime)) {
          sessionStorage.setItem("audioTime", String(audio.currentTime));
        }
      };

      const unmuteAudio = () => {
        if (!audio) return;
        if (audio.muted) audio.muted = false;
        audio.play().catch(() => {});
        sessionStorage.setItem("audioUnlocked", "1");
        window.removeEventListener("click", unmuteAudio);
        window.removeEventListener("scroll", unmuteAudio);
        document.getElementById("audio-overlay")?.classList.add("is-hidden");
      };

      const bindAudioSaveLinks = () => {
        document.querySelectorAll("[data-audio-save]").forEach((link) => {
          link.addEventListener("click", saveAudioTime);
        });
      };


      window.addEventListener("DOMContentLoaded", () => {
        if (audio) {
          audio.addEventListener("loadedmetadata", restoreAudioTime, { once: true });
          audio.addEventListener("timeupdate", saveAudioTime);
        }
        startAudio();
        if (sessionStorage.getItem("audioUnlocked") === "1") {
          document.getElementById("audio-overlay")?.classList.add("is-hidden");
          unmuteAudio();
        }
        bindAudioSaveLinks();
      });
      window.addEventListener("pageshow", () => {
        if (sessionStorage.getItem("audioUnlocked") === "1") {
          document.getElementById("audio-overlay")?.classList.add("is-hidden");
          unmuteAudio();
        }
      });
      window.addEventListener("beforeunload", saveAudioTime);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveAudioTime();
      });
      window.addEventListener("click", unmuteAudio);
      window.addEventListener("scroll", unmuteAudio, { once: true });
      document.getElementById("audio-overlay")?.addEventListener("click", unmuteAudio);
    </script>
  </body>
</html>
